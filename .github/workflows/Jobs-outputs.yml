name: 02-Jobs Outputs
on:
  workflow_call:
    outputs:
      app_version:
        description: App Version
        value: ${{ jobs.test-job.outputs.app_version }}
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Information
        id: data
        run: |
          echo "========================"
          echo "version=2.4" >> $GITHUB_OUTPUT
          echo "========================"

    outputs:
      app_version: ${{ steps.data.outputs.version }}

    
